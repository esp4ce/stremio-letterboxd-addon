name: CI

on:
  push:
    branches: [integration, main]
  pull_request:
    branches: [integration, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend
        run: npm run test:run

  audit-frontend:
    name: Security audit frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # npm audit exits non-zero on any finding; the script decides, honouring its short allowlist.
        run: |
          npm audit --json > audit.json || true
          node .github/scripts/audit-high.mjs < audit.json

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
