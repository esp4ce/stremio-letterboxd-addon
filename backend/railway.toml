# Deploy settings live here, not in the dashboard: this file overrides it.
[build]
builder = "RAILPACK"

[deploy]
# Run node directly so SIGTERM reaches the app; through npm it ends as a non-zero exit.
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
# Time between SIGTERM and SIGKILL, so in-flight requests and the native sync job can finish.
drainingSeconds = 15
# A web service should never stay down: restart whatever the exit cause.
restartPolicyType = "ALWAYS"

# Persistent volume for the SQLite database
[[volumes]]
name = "database"
mountPath = "/app/data"
